<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Planejamento | Field Ops</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>

<body>
  <nav class="navbar app-nav">
    <div class="container-fluid app-container"><a class="navbar-brand brand" href="index.html"><span
          class="brand-mark"><i class="bi bi-compass"></i></span><span>field<span
            class="brand-accent">ops</span></span></a>
      <div class="nav-links"><a class="nav-link" href="index.html">Visão geral</a><a class="nav-link"
          href="inspecoes.html">Inspeções</a><a class="nav-link active" href="planejamento.html">Planejamento</a><a
          class="nav-link" href="clientes.html">Cadastros</a></div>
    </div>
  </nav>
  <main class="container-fluid app-container page-content">
    <div class="page-heading">
      <div>
        <p class="eyebrow">Nova atividade</p>
        <h1>Planejar inspeção</h1>
        <p class="text-secondary mb-0">Defina os dados da próxima visita técnica.</p>
      </div>
    </div>
    <section class="panel p-4 p-lg-5">
      <form>
        <div class="row g-3">
          <div class="col-12 col-md-6"><label class="form-label" for="cliente">Cliente</label><select id="cliente"
              class="form-select">
              <option selected>Selecione um cliente</option>
              <option>Indústria Horizonte</option>
              <option>Logística Via Norte</option>
            </select></div>
          <div class="col-12 col-md-6"><label class="form-label" for="local">Local</label><select id="local"
              class="form-select">
              <option selected>Selecione um local</option>
              <option>Unidade Centro</option>
              <option>Planta Norte</option>
            </select></div>
          <div class="col-12 col-md-6"><label class="form-label" for="equipamento">Equipamento</label><select
              id="equipamento" class="form-select">
              <option selected>Selecione um equipamento</option>
              <option>Compressor CP-04</option>
              <option>Painel elétrico QD-12</option>
            </select></div>
          <div class="col-12 col-md-6"><label class="form-label" for="checklist">Modelo de checklist</label><select
              id="checklist" class="form-select">
              <option selected>Selecione um modelo</option>
              <option>Segurança de máquinas</option>
              <option>Inspeção elétrica</option>
            </select></div>
          <div class="col-12 col-md-6"><label class="form-label" for="tecnico">Técnico responsável</label><select
              id="tecnico" class="form-select">
              <option selected>Selecione um técnico</option>
              <option>Marina Costa</option>
              <option>Rafael Lima</option>
              <option>Joana Alves</option>
            </select></div>
          <div class="col-12 col-md-3"><label class="form-label" for="data">Data da inspeção</label><input id="data"
              class="form-control" type="date"></div>
          <div class="col-12 col-md-3"><label class="form-label" for="prioridade">Prioridade</label><select
              id="prioridade" class="form-select">
              <option>Normal</option>
              <option>Alta</option>
              <option>Urgente</option>
            </select></div>
          <div class="col-12"><label class="form-label" for="observacoes">Observações</label><textarea id="observacoes"
              class="form-control" rows="3" placeholder="Informações adicionais para a equipe"></textarea></div>
        </div>
        <div class="d-flex justify-content-end gap-2 mt-4"><a class="btn btn-outline-secondary"
            href="inspecoes.html">Cancelar</a><button class="btn btn-ink" type="button">Salvar planejamento</button>
        </div>
      </form>
    </section>
    <footer class="page-footer">Field Ops <span>·</span> Formulário demonstrativo</footer>
  </main>
</body>

</html>
